name: Repair exported baseline function terminators

on:
  push:
    branches:
      - chore/supabase-schema-baseline
    paths:
      - .github/workflows/fix-baseline-function-terminators.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/supabase-schema-baseline
      - name: Add missing function terminator semicolons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('supabase/baseline/10_public_schema.sql')
          lines = path.read_text().splitlines(keepends=True)
          out = []
          changed = 0
          for line in lines:
              raw = line.rstrip('\r\n')
              ending = line[len(raw):]
              if raw == '$function$':
                  out.append('$function$;' + ending)
                  changed += 1
              else:
                  out.append(line)
          if changed != 115:
              raise SystemExit(f'Expected 115 unterminated function definitions, found {changed}')
          path.write_text(''.join(out))
          print(f'Fixed {changed} function definitions')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/baseline/10_public_schema.sql
          git commit -m 'fix: terminate baseline function definitions'
          git push origin HEAD:chore/supabase-schema-baseline
