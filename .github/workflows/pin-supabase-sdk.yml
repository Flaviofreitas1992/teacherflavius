name: Pin Supabase browser SDK

on:
  push:
    branches:
      - security/hardening-20260820

permissions:
  contents: write

jobs:
  pin-sdk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening-20260820

      - name: Pin exact SDK version
        shell: python
        run: |
          from pathlib import Path

          old = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"'
          new = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"'
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  continue
              updated = text.replace(old, new)
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          print(f'Pinned Supabase SDK in {len(changed)} HTML files.')
          for path in changed:
              print(path)

      - name: Commit deterministic replacements
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No replacements needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' '**/*.html' || true
          git commit -m 'security: pin Supabase browser SDK to 2.112.3'
          git push origin HEAD:security/hardening-20260820
