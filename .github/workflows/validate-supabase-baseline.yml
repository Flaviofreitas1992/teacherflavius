name: Validate Supabase baseline restore

on:
  push:
    branches:
      - chore/supabase-schema-baseline
    paths:
      - .github/workflows/validate-supabase-baseline.yml
  pull_request:
    branches:
      - main
    paths:
      - supabase/baseline/**
      - supabase/migrations/**
      - .github/workflows/validate-supabase-baseline.yml

permissions:
  contents: write

jobs:
  restore-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out baseline branch
        uses: actions/checkout@v4
        with:
          ref: chore/supabase-schema-baseline

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a clean local Supabase stack
        id: start
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "supabase start failed" > /tmp/failure-summary.txt' ERR

          if [ -d supabase/migrations ]; then
            mv supabase/migrations /tmp/teacherflavius-migrations
          fi
          if [ -f supabase/seed.sql ]; then
            mv supabase/seed.sql /tmp/teacherflavius-seed.sql
          fi

          supabase init --force
          mkdir -p supabase/migrations
          supabase start

          rm -rf supabase/migrations
          if [ -d /tmp/teacherflavius-migrations ]; then
            mv /tmp/teacherflavius-migrations supabase/migrations
          fi
          if [ -f /tmp/teacherflavius-seed.sql ]; then
            mv /tmp/teacherflavius-seed.sql supabase/seed.sql
          fi

      - name: Apply production reconstruction baseline
        id: apply
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          test -n "$DB_CONTAINER"

          for file in \
            supabase/baseline/10_public_schema.sql \
            supabase/baseline/20_default_privileges.sql \
            supabase/baseline/30_platform_config.sql
          do
            echo "Applying $file"
            if ! docker exec -i "$DB_CONTAINER" \
              psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
              < "$file" 2> /tmp/psql-error.txt
            then
              {
                echo "Baseline apply failed in: $file"
                tail -n 20 /tmp/psql-error.txt
              } > /tmp/failure-summary.txt
              exit 1
            fi
          done

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          select vault.create_secret(
            'restore-test-placeholder-not-a-production-secret',
            'teacherflavius_notification_webhook_secret',
            'Temporary value used only by the baseline restore CI test'
          );
          SQL

      - name: Compare restored catalog with production fingerprint
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"

          docker exec -i "$DB_CONTAINER" \
            psql -U postgres -d postgres -At -v ON_ERROR_STOP=1 <<'SQL' \
            > /tmp/actual-fingerprint.json
          select json_build_object(
            'tables', (
              select count(*)
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind in ('r','p')
            ),
            'constraints', (
              select count(*)
              from pg_constraint co
              join pg_namespace n on n.oid = co.connamespace
              where n.nspname = 'public'
            ),
            'non_constraint_indexes', (
              select count(*)
              from pg_index i
              join pg_class tbl on tbl.oid = i.indrelid
              join pg_namespace n on n.oid = tbl.relnamespace
              where n.nspname = 'public'
                and not exists (
                  select 1 from pg_constraint co where co.conindid = i.indexrelid
                )
            ),
            'public_functions', (
              select count(*)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'public'
            ),
            'private_functions', (
              select count(*)
              from pg_proc p
              join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'private'
            ),
            'rls_policies', (
              select count(*) from pg_policies where schemaname = 'public'
            ),
            'public_user_triggers', (
              select count(*)
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and not t.tgisinternal
            ),
            'application_auth_triggers', (
              select count(*)
              from pg_trigger t
              join pg_class c on c.oid = t.tgrelid
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'auth' and not t.tgisinternal
                and t.tgfoid in (
                  select p.oid
                  from pg_proc p
                  join pg_namespace pn on pn.oid = p.pronamespace
                  where pn.nspname in ('public','private')
                )
            ),
            'application_event_triggers', (
              select count(*)
              from pg_event_trigger e
              where e.evtfoid in (
                select p.oid
                from pg_proc p
                join pg_namespace n on n.oid = p.pronamespace
                where n.nspname in ('public','private')
              )
            ),
            'cron_jobs', (
              select count(*) from cron.job
              where jobname = 'sync-auto-makeup-slots-30-days'
            ),
            'storage_buckets', (
              select count(*) from storage.buckets
            ),
            'vault_secret_names', (
              select count(*) from vault.secrets
              where name = 'teacherflavius_notification_webhook_secret'
            )
          );
          SQL

          jq -S 'del(.captured_from_migration_version)' \
            supabase/baseline/schema-fingerprint.json \
            > /tmp/expected-fingerprint.json
          jq -S . /tmp/actual-fingerprint.json \
            > /tmp/actual-fingerprint-normalized.json

          if ! diff -u \
            /tmp/expected-fingerprint.json \
            /tmp/actual-fingerprint-normalized.json \
            > /tmp/fingerprint-diff.txt
          then
            {
              echo 'Fingerprint mismatch:'
              cat /tmp/fingerprint-diff.txt
            } > /tmp/failure-summary.txt
            exit 1
          fi

      - name: Record disposable validation result
        if: always()
        shell: bash
        env:
          START_OUTCOME: ${{ steps.start.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail

          STATUS=failed
          if [ "$START_OUTCOME" = success ] && \
             [ "$APPLY_OUTCOME" = success ] && \
             [ "$COMPARE_OUTCOME" = success ]; then
            STATUS=success
          fi

          FAILURE_SUMMARY=''
          if [ -f /tmp/failure-summary.txt ]; then
            FAILURE_SUMMARY="$(cat /tmp/failure-summary.txt)"
          fi

          ACTUAL='null'
          if [ -s /tmp/actual-fingerprint-normalized.json ]; then
            ACTUAL="$(cat /tmp/actual-fingerprint-normalized.json)"
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg start "$START_OUTCOME" \
            --arg apply "$APPLY_OUTCOME" \
            --arg compare "$COMPARE_OUTCOME" \
            --arg failure_summary "$FAILURE_SUMMARY" \
            --arg tested_commit "$GITHUB_SHA" \
            --argjson actual "$ACTUAL" \
            '{status:$status,start:$start,apply:$apply,compare:$compare,failure_summary:$failure_summary,tested_commit:$tested_commit,actual_fingerprint:$actual}' \
            > supabase/baseline/restore-validation-result.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/baseline/restore-validation-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record baseline restore validation result'
            git push origin HEAD:chore/supabase-schema-baseline
          fi

      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
