name: Pin Edge Supabase SDK

on:
  push:
    branches:
      - security/pin-edge-deps-20260820

permissions:
  contents: write

jobs:
  pin-edge-sdk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: security/pin-edge-deps-20260820

      - name: Pin Supabase SDK imports
        shell: python
        run: |
          from pathlib import Path

          root = Path('supabase/functions')
          changed = []
          replacements = {
              'npm:@supabase/supabase-js@2"': 'npm:@supabase/supabase-js@2.112.3"',
              'npm:@supabase/supabase-js@2.57.4"': 'npm:@supabase/supabase-js@2.112.3"',
              'https://esm.sh/@supabase/supabase-js@2"': 'https://esm.sh/@supabase/supabase-js@2.112.3"',
          }

          for path in root.rglob('*.ts'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Pinned Edge Supabase SDK in {len(changed)} files.')
          for path in changed:
              print(path)

      - name: Commit deterministic replacements
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No replacements needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions
          git commit -m 'security: pin Edge Supabase SDK to 2.112.3'
          git push origin HEAD:security/pin-edge-deps-20260820
