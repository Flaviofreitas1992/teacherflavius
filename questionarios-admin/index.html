<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Questionários - Teacher Flávio</title>
  <script>
    (async function () {
      const response = await fetch('/questionarios_admin.html', { cache: 'no-store' });
      const html = await response.text();
      document.open();
      document.write(html.replace('<head>', '<head>\n  <base href="/">'));
      document.close();
    })();
  </script>
</head>
<body><p>Carregando construtor de questionários...</p></body>
</html>
