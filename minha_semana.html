<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Semana - Teacher Flávio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase_config.js?v=20260715-1"></script>
  <script src="auth.js?v=20260730-1"></script>
  <link rel="stylesheet" href="aula_template.css?v=20260430-3">
  <style>
    :root {
      --panel: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --muted: #94a3b8;
      --text: #f1f5f9;
      --green: #86efac;
      --red: #fca5a5;
      --purple: #c4b5fd;
      --amber: #fde68a;
    }

    .container { max-width: 920px; }
    .week-intro { text-align: center; margin: -6px auto 24px; color: #cbd5e1; line-height: 1.6; }
    .week-intro strong { color: var(--text); }

    .progress-panel {
      border: 1px solid rgba(129,140,248,0.28);
      border-radius: 22px;
      padding: 22px;
      background: rgba(129,140,248,0.07);
      margin-bottom: 18px;
    }

    .progress-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .progress-title { font-size: 20px; color: var(--text); }
    .progress-number { font-size: 30px; font-weight: bold; color: var(--purple); }
    .progress-track { height: 12px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.08); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg,#818cf8,#a78bfa); transition: width .35s ease; }
    .progress-caption { margin-top: 9px; color: var(--muted); font-size: 13px; }

    .checklist {
      display: grid;
      gap: 10px;
      margin-bottom: 20px;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .check-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .check-icon { font-size: 20px; flex: 0 0 auto; }
    .check-text { color: #e2e8f0; line-height: 1.4; }
    .check-state { font-size: 12px; font-weight: bold; white-space: nowrap; }
    .check-state.done { color: var(--green); }
    .check-state.pending { color: var(--red); }
    .check-state.neutral { color: var(--amber); }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 14px;
    }

    .week-card {
      display: flex;
      flex-direction: column;
      min-height: 210px;
      padding: 19px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
    }

    .week-card.overdue { border-color: rgba(248,113,113,.45); background: rgba(127,29,29,.20); }
    .week-card.good { border-color: rgba(74,222,128,.35); background: rgba(20,83,45,.18); }
    .week-card.current { border-color: rgba(129,140,248,.42); background: rgba(67,56,202,.13); }

    .card-kicker { color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .card-title { color: var(--text); font-size: 18px; line-height: 1.35; margin-bottom: 9px; }
    .card-text { color: #cbd5e1; font-size: 13px; line-height: 1.55; margin-bottom: 14px; }
    .card-status { display: inline-flex; align-self: flex-start; border-radius: 999px; padding: 6px 9px; font-size: 11px; font-weight: bold; margin-bottom: 14px; }
    .card-status.done { color: var(--green); background: rgba(74,222,128,.13); }
    .card-status.pending { color: var(--red); background: rgba(248,113,113,.13); }
    .card-status.info { color: var(--purple); background: rgba(167,139,250,.13); }
    .card-status.warning { color: var(--amber); background: rgba(245,158,11,.13); }

    .card-action {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 11px;
      border: 1px solid rgba(129,140,248,.35);
      color: #e0e7ff;
      background: rgba(129,140,248,.08);
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      padding: 9px 12px;
    }

    .practice-days { display: flex; gap: 7px; flex-wrap: wrap; margin: 2px 0 15px; }
    .practice-day { width: 29px; height: 29px; display:flex; align-items:center; justify-content:center; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); color: var(--muted); font-size: 10px; }
    .practice-day.done { color: #052e16; background: var(--green); border-color: var(--green); font-weight: bold; }

    .loading-panel, .blocked-panel {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      color: #cbd5e1;
      text-align: center;
      line-height: 1.6;
    }

    #dashboard[hidden] { display: none; }

    @media (max-width: 720px) {
      .week-grid { grid-template-columns: 1fr; }
      .check-item { align-items: flex-start; }
      .check-state { white-space: normal; text-align: right; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-links">
      <a class="top-link" href="/">HOME</a>
      <a class="top-link" href="/area-do-estudante/">ÁREA DO ESTUDANTE</a>
    </div>

    <div class="header">
      <div><span class="badge">TEACHER FLÁVIO</span></div>
      <h1>Minha Semana</h1>
      <div id="pageStatus" class="status">Carregando sua semana...</div>
    </div>

    <div class="divider"></div>

    <div id="loadingPanel" class="loading-panel">Organizando suas atividades e seu progresso semanal...</div>

    <main id="dashboard" hidden>
      <p id="weekIntro" class="week-intro"></p>

      <section class="progress-panel" aria-label="Progresso semanal">
        <div class="progress-head">
          <div>
            <div class="progress-title">Checklist da semana</div>
            <div id="progressCaption" class="progress-caption"></div>
          </div>
          <div id="progressNumber" class="progress-number">0%</div>
        </div>
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
      </section>

      <section id="checklist" class="checklist" aria-label="Tarefas da semana"></section>

      <section class="week-grid">
        <article id="exerciseCard" class="week-card current"></article>
        <article id="overdueCard" class="week-card"></article>
        <article id="flashcardCard" class="week-card"></article>
        <article id="grammarCard" class="week-card"></article>
        <article id="classCard" class="week-card"></article>
        <article class="week-card">
          <div class="card-kicker">Acompanhamento</div>
          <div class="card-title">Seu progresso completo</div>
          <div class="card-text">Veja todas as atividades concluídas e pendentes no painel de progresso.</div>
          <span class="card-status info">VISÃO GERAL</span>
          <a class="card-action" href="/meu_progresso.html">ABRIR MEU PROGRESSO</a>
        </article>
      </section>
    </main>
  </div>

  <script>
    const TZ = "America/Sao_Paulo";
    const CUTOFF = "2026-07-30";
    const DAY_MS = 86400000;
    let currentUser = null;

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/\"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function isEnrolled(profile) {
      return !!profile && (profile.enrolled === true || profile.enrolled === "true" || !!profile.enrollment_code);
    }

    function extractActivityNumber(title) {
      const match = String(title || "").match(/ATIVIDADE\s+(\d+)/i);
      return match ? Number(match[1]) : Number.MAX_SAFE_INTEGER;
    }

    function dateKeyInSaoPaulo(value) {
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const parts = new Intl.DateTimeFormat("en-CA", { timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(date);
      const values = {};
      parts.forEach(function (part) { if (part.type !== "literal") values[part.type] = part.value; });
      return values.year + "-" + values.month + "-" + values.day;
    }

    function dateKeyToMs(key) {
      const match = String(key || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return NaN;
      return Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function msToDateKey(ms) {
      const date = new Date(ms);
      return date.getUTCFullYear() + "-" + String(date.getUTCMonth()+1).padStart(2,"0") + "-" + String(date.getUTCDate()).padStart(2,"0");
    }

    function addDays(key, days) { return msToDateKey(dateKeyToMs(key) + days * DAY_MS); }

    function formatDate(key) {
      const match = String(key || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return match ? match[3] + "/" + match[2] : key;
    }

    function getStartDate(profile) {
      const stored = profile && profile.exercise_schedule_start_date ? String(profile.exercise_schedule_start_date).slice(0,10) : "";
      if (/^\d{4}-\d{2}-\d{2}$/.test(stored)) return stored;
      const created = profile && profile.created_at ? dateKeyInSaoPaulo(profile.created_at) : "";
      if (!created || created <= CUTOFF) return CUTOFF;
      return created;
    }

    function getWeekInfo(profile) {
      const start = getStartDate(profile);
      const today = dateKeyInSaoPaulo(new Date());
      const startMs = dateKeyToMs(start);
      const todayMs = dateKeyToMs(today);
      const elapsed = Math.max(0, Math.floor((todayMs - startMs) / DAY_MS));
      const week = Math.floor(elapsed / 7) + 1;
      const weekStart = addDays(start, (week - 1) * 7);
      const weekEnd = addDays(weekStart, 6);
      return { start:start, week:week, weekStart:weekStart, weekEnd:weekEnd };
    }

    async function loadExercises() {
      const response = await Auth.getClient().rpc("get_public_teacher_exercises");
      if (response.error) throw response.error;
      return (response.data || []).map(function (item) {
        return { id:item.exercise_id, title:item.exercise_title, url:item.exercise_url, number:extractActivityNumber(item.exercise_title) };
      }).filter(function (item) { return item.id; }).sort(function (a,b) { return a.number - b.number; });
    }

    async function loadCompletions() {
      const response = await Auth.getClient().from("daily_exercise_completion").select("exercise_id, completed").eq("user_id", currentUser.id);
      if (response.error) throw response.error;
      return new Map((response.data || []).map(function (row) { return [row.exercise_id, row.completed === true]; }));
    }

    async function loadFlashcards(weekStart, weekEnd) {
      const response = await Auth.getClient().from("flashcard_practice_days")
        .select("practice_date")
        .eq("user_id", currentUser.id)
        .gte("practice_date", weekStart)
        .lte("practice_date", weekEnd)
        .order("practice_date", { ascending:true });
      if (response.error) throw response.error;
      return Array.from(new Set((response.data || []).map(function (row) { return String(row.practice_date).slice(0,10); })));
    }

    async function loadGrammar() {
      const client = Auth.getClient();
      const results = await Promise.all([
        client.from("grammar_lessons").select("id, title, created_at").order("created_at", { ascending:true }),
        client.from("grammar_lesson_completion").select("lesson_id, completed").eq("user_id", currentUser.id)
      ]);
      if (results[0].error) throw results[0].error;
      if (results[1].error) throw results[1].error;
      const lessons = results[0].data || [];
      const done = new Map((results[1].data || []).map(function (row) { return [row.lesson_id, row.completed === true]; }));
      const completed = lessons.filter(function (lesson) { return done.get(lesson.id) === true; });
      const next = lessons.find(function (lesson) { return done.get(lesson.id) !== true; }) || null;
      return { total:lessons.length, completed:completed.length, next:next };
    }

    async function loadClass() {
      const client = Auth.getClient();
      const membership = await client.from("class_students").select("class_number").eq("user_id", currentUser.id).limit(1);
      if (membership.error) throw membership.error;
      if (!membership.data || !membership.data.length) return null;
      const number = membership.data[0].class_number;
      const classResponse = await client.from("teacher_classes").select("class_number, class_name").eq("class_number", number).limit(1);
      if (classResponse.error) throw classResponse.error;
      return classResponse.data && classResponse.data.length ? classResponse.data[0] : { class_number:number, class_name:"Turma " + number };
    }

    function statusPill(text, kind) { return '<span class="card-status ' + kind + '">' + esc(text) + '</span>'; }

    function renderPracticeDays(info, practiceDates) {
      const practiced = new Set(practiceDates);
      const labels = ["D1","D2","D3","D4","D5","D6","D7"];
      return '<div class="practice-days">' + labels.map(function (label,index) {
        const key = addDays(info.weekStart,index);
        return '<span class="practice-day ' + (practiced.has(key) ? 'done' : '') + '" title="' + esc(formatDate(key)) + '">' + label + '</span>';
      }).join("") + '</div>';
    }

    function renderDashboard(profile, info, exercises, completions, practiceDates, grammar, classInfo) {
      const currentActivity = exercises.find(function (item) { return item.number === info.week; }) || null;
      const overdue = exercises.filter(function (item) { return item.number < info.week && completions.get(item.id) !== true; });
      const currentDone = !!currentActivity && completions.get(currentActivity.id) === true;
      const practicedThisWeek = practiceDates.length > 0;

      document.getElementById("weekIntro").innerHTML = '<strong>SEMANA ' + info.week + '</strong> · ' + esc(formatDate(info.weekStart)) + ' a ' + esc(formatDate(info.weekEnd)) + '<br>Seu ciclo de exercícios começou em ' + esc(formatDate(info.start)) + '/'+ esc(info.start.slice(0,4)) + '.';

      const goals = [];
      if (currentActivity) goals.push({ label:"Concluir a atividade da semana", done:currentDone, neutral:false });
      else goals.push({ label:"Atividade da semana ainda não publicada", done:false, neutral:true });
      goals.push({ label:"Manter as atividades anteriores em dia", done:overdue.length === 0, neutral:false });
      goals.push({ label:"Praticar flashcards pelo menos uma vez na semana", done:practicedThisWeek, neutral:false });

      const countable = goals.filter(function (goal) { return !goal.neutral; });
      const doneCount = countable.filter(function (goal) { return goal.done; }).length;
      const percentage = countable.length ? Math.round(doneCount / countable.length * 100) : 0;
      document.getElementById("progressNumber").textContent = percentage + "%";
      document.getElementById("progressFill").style.width = percentage + "%";
      document.getElementById("progressCaption").textContent = doneCount + " de " + countable.length + " metas concluídas";
      document.getElementById("checklist").innerHTML = goals.map(function (goal) {
        const state = goal.neutral ? "neutral" : goal.done ? "done" : "pending";
        const stateText = goal.neutral ? "AGUARDANDO" : goal.done ? "CONCLUÍDO" : "PENDENTE";
        const icon = goal.neutral ? "⏳" : goal.done ? "✅" : "○";
        return '<div class="check-item"><div class="check-main"><span class="check-icon">' + icon + '</span><span class="check-text">' + esc(goal.label) + '</span></div><span class="check-state ' + state + '">' + stateText + '</span></div>';
      }).join("");

      const exerciseCard = document.getElementById("exerciseCard");
      if (!currentActivity) {
        exerciseCard.className = "week-card";
        exerciseCard.innerHTML = '<div class="card-kicker">Atividade da semana</div><div class="card-title">Ainda não publicada</div><div class="card-text">Não existe uma atividade publicada correspondente à Semana ' + info.week + '.</div>' + statusPill("AGUARDANDO PUBLICAÇÃO","warning") + '<a class="card-action" href="/exercicios-diarios/">ABRIR PORTAL DE EXERCÍCIOS</a>';
      } else {
        exerciseCard.className = "week-card " + (currentDone ? "good" : "current");
        exerciseCard.innerHTML = '<div class="card-kicker">Atividade da semana</div><div class="card-title">' + esc(currentActivity.title) + '</div><div class="card-text">Esta é a atividade prevista para o seu ciclo nesta semana.</div>' + statusPill(currentDone ? "CONCLUÍDA" : "FAZER ESTA SEMANA", currentDone ? "done" : "info") + '<a class="card-action" href="' + esc(currentActivity.url || "/exercicios-diarios/") + '" ' + (currentActivity.url ? 'target="_blank" rel="noopener noreferrer"' : '') + '>' + (currentDone ? "REVER ATIVIDADE" : "FAZER ATIVIDADE") + '</a>';
      }

      const overdueCard = document.getElementById("overdueCard");
      if (!overdue.length) {
        overdueCard.className = "week-card good";
        overdueCard.innerHTML = '<div class="card-kicker">Pendências anteriores</div><div class="card-title">Tudo em dia</div><div class="card-text">Você não tem atividades de semanas anteriores pendentes.</div>' + statusPill("SEM ATRASOS","done") + '<a class="card-action" href="/meu_progresso.html">VER PROGRESSO</a>';
      } else {
        overdueCard.className = "week-card overdue";
        overdueCard.innerHTML = '<div class="card-kicker">Pendências anteriores</div><div class="card-title">' + overdue.length + ' atividade(s) atrasada(s)</div><div class="card-text">A mais antiga é <strong>' + esc(overdue[0].title) + '</strong>. Priorize as atividades na ordem numérica.</div>' + statusPill("PRECISA DE ATENÇÃO","pending") + '<a class="card-action" href="' + esc(overdue[0].url || "/exercicios-diarios/") + '" ' + (overdue[0].url ? 'target="_blank" rel="noopener noreferrer"' : '') + '>FAZER A MAIS ANTIGA</a>';
      }

      const flashcardCard = document.getElementById("flashcardCard");
      flashcardCard.className = "week-card " + (practicedThisWeek ? "good" : "");
      flashcardCard.innerHTML = '<div class="card-kicker">Flashcards</div><div class="card-title">' + practiceDates.length + ' dia(s) de prática nesta semana</div><div class="card-text">Cada círculo representa um dia do seu ciclo semanal.</div>' + renderPracticeDays(info,practiceDates) + statusPill(practicedThisWeek ? "PRÁTICA REGISTRADA" : "PRATICAR ESTA SEMANA", practicedThisWeek ? "done" : "warning") + '<a class="card-action" href="/flashcards/">PRATICAR FLASHCARDS</a>';

      const grammarCard = document.getElementById("grammarCard");
      if (!grammar.total) {
        grammarCard.innerHTML = '<div class="card-kicker">Aulas de gramática</div><div class="card-title">Nenhuma aula disponível</div><div class="card-text">Quando novas aulas forem publicadas, seu progresso aparecerá aqui.</div>' + statusPill("SEM AULAS PUBLICADAS","warning") + '<a class="card-action" href="/aulas-de-gramatica.html">ABRIR GRAMÁTICA</a>';
      } else {
        const grammarDone = grammar.completed === grammar.total;
        grammarCard.className = "week-card " + (grammarDone ? "good" : "");
        grammarCard.innerHTML = '<div class="card-kicker">Aulas de gramática</div><div class="card-title">' + grammar.completed + ' de ' + grammar.total + ' concluída(s)</div><div class="card-text">' + (grammar.next ? 'Próxima aula pendente: <strong>' + esc(grammar.next.title) + '</strong>.' : 'Todas as aulas publicadas foram concluídas.') + '</div>' + statusPill(grammarDone ? "TUDO CONCLUÍDO" : "CONTINUAR ESTUDANDO", grammarDone ? "done" : "info") + '<a class="card-action" href="/aulas-de-gramatica.html">ABRIR AULAS DE GRAMÁTICA</a>';
      }

      const classCard = document.getElementById("classCard");
      if (classInfo) {
        classCard.innerHTML = '<div class="card-kicker">Minha turma</div><div class="card-title">' + esc(classInfo.class_name || ("Turma " + classInfo.class_number)) + '</div><div class="card-text">Acesse sua turma para consultar as informações e materiais vinculados a ela.</div>' + statusPill("TURMA ATIVA","info") + '<a class="card-action" href="/minha-turma/">ABRIR MINHA TURMA</a>';
      } else {
        classCard.innerHTML = '<div class="card-kicker">Minha turma</div><div class="card-title">Turma não identificada</div><div class="card-text">Seu vínculo de turma não foi localizado neste momento.</div>' + statusPill("VERIFICAR VÍNCULO","warning") + '<a class="card-action" href="/minha-turma/">ABRIR MINHA TURMA</a>';
      }

      document.getElementById("loadingPanel").hidden = true;
      document.getElementById("dashboard").hidden = false;
      document.getElementById("pageStatus").textContent = "Sua semana foi atualizada.";
    }

    async function init() {
      if (!window.Auth || !Auth.isConfigured()) {
        document.getElementById("pageStatus").textContent = "Supabase não configurado.";
        document.getElementById("loadingPanel").textContent = "Não foi possível carregar seus dados.";
        return;
      }

      const session = await Auth.getSession();
      if (!session || !session.user) {
        window.location.href = "/login.html?next=" + encodeURIComponent("/minha-semana/");
        return;
      }
      currentUser = session.user;

      try {
        const profile = await Auth.getProfile();
        if (!isEnrolled(profile)) {
          document.getElementById("pageStatus").textContent = "Acesso restrito a alunos matriculados.";
          document.getElementById("loadingPanel").className = "blocked-panel";
          document.getElementById("loadingPanel").textContent = "Esta página está disponível apenas para alunos matriculados.";
          return;
        }

        const info = getWeekInfo(profile);
        const baseResults = await Promise.all([loadExercises(), loadCompletions()]);
        const optionalResults = await Promise.allSettled([loadFlashcards(info.weekStart,info.weekEnd), loadGrammar(), loadClass()]);
        const practiceDates = optionalResults[0].status === "fulfilled" ? optionalResults[0].value : [];
        const grammar = optionalResults[1].status === "fulfilled" ? optionalResults[1].value : { total:0, completed:0, next:null };
        const classInfo = optionalResults[2].status === "fulfilled" ? optionalResults[2].value : null;
        renderDashboard(profile,info,baseResults[0],baseResults[1],practiceDates,grammar,classInfo);
      } catch (error) {
        console.error("Erro ao carregar Minha Semana:", error);
        document.getElementById("pageStatus").textContent = "Não foi possível carregar sua semana.";
        document.getElementById("loadingPanel").className = "blocked-panel";
        document.getElementById("loadingPanel").textContent = "O painel não pôde ser carregado. Atualize a página e tente novamente.";
      }
    }

    init();
  </script>
</body>
</html>
