<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turmas - Teacher Flávio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase_config.js?v=20260429-1"></script>
  <script src="auth.js?v=20260429-1"></script>
  <link rel="stylesheet" href="professor.css?v=20260429-1">
  <style>
    .form-panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:20px;backdrop-filter:blur(12px);margin-bottom:22px}
    .form-panel label{display:block;color:#cbd5e1;font-size:13px;margin:12px 0 6px}
    .form-panel input,.form-panel select,.class-type-select{width:100%;box-sizing:border-box;background:#111827;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 13px;color:#f1f5f9;font-size:14px;font-family:Georgia,serif}
    .form-panel input:focus,.form-panel select:focus,.class-type-select:focus{outline:none;border-color:#818cf8}
    .class-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(12px)}
    .class-card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#f1f5f9;font-weight:bold;font-size:17px;text-decoration:none}
    .class-type-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:bold;letter-spacing:.45px;white-space:nowrap}
    .class-type-badge.group{color:#bfdbfe;background:rgba(59,130,246,.15);border:1px solid rgba(96,165,250,.35)}
    .class-type-badge.individual{color:#d8b4fe;background:rgba(168,85,247,.14);border:1px solid rgba(192,132,252,.35)}
    .class-type-badge.unset{color:#fde68a;background:rgba(245,158,11,.12);border:1px solid rgba(251,191,36,.3)}
    .class-meta{color:#94a3b8;font-size:13px;line-height:1.5;margin:0}
    .type-editor{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;display:grid;gap:8px}
    .type-editor label{color:#cbd5e1;font-size:12px;font-weight:bold}
    .type-save-button{width:100%;border:1.5px solid rgba(52,211,153,.4);background:rgba(16,185,129,.1);color:#a7f3d0;border-radius:12px;padding:10px 12px;font-family:Georgia,serif;font-weight:bold;cursor:pointer}
    .type-save-button:disabled{opacity:.5;cursor:wait}
    .class-actions{display:grid;grid-template-columns:1fr;gap:10px}
    .open-class-button,.remove-class-button{width:100%;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:11px 13px;font-family:Georgia,serif;font-weight:bold;cursor:pointer;text-decoration:none;font-size:13px;box-sizing:border-box}
    .open-class-button{border:1.5px solid rgba(129,140,248,.45);background:rgba(129,140,248,.1);color:#c4b5fd}
    .remove-class-button{border:1.5px solid rgba(248,113,113,.45);background:rgba(248,113,113,.08);color:#fca5a5}
    .remove-class-button:disabled{opacity:.45;cursor:not-allowed}
    @media(min-width:680px){.class-actions{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body class="auth-checking">
  <div class="container">
    <div class="top-links">
      <a class="top-link" href="professor.html">ÁREA DO PROFESSOR</a>
      <a class="top-link" href="quadro-de-turmas.html">QUADRO DE TURMAS</a>
      <a class="top-link" href="index.html">HOME</a>
    </div>

    <div class="header">
      <div><span class="badge">TEACHER FLÁVIO</span></div>
      <h1>Turmas</h1>
      <div id="adminStatus" class="status">Verificando credenciais de professor...</div>
    </div>

    <div class="divider"></div>

    <div class="form-panel">
      <h2>Criar nova turma</h2>
      <form id="createClassForm">
        <label for="className">Nome da turma</label>
        <input id="className" type="text" placeholder="Ex.: Turma A1 - Terça e Quinta" />
        <label for="classType">Tipo da turma</label>
        <select id="classType" required>
          <option value="">Selecione</option>
          <option value="group">GRUPO</option>
          <option value="individual">INDIVIDUAL</option>
        </select>
        <button class="delete-button" type="submit" style="border-color:rgba(129,140,248,.45);background:rgba(129,140,248,.10);color:#c4b5fd;">CRIAR TURMA</button>
        <div id="classMessage" class="empty" style="margin-top:10px;"></div>
      </form>
    </div>

    <div id="classesGrid" class="menu-grid"></div>
  </div>

  <script src="turmas.js?v=20260807-type-1"></script>
  <script src="animated_cards.js?v=20260807-type-1"></script>
</body>
</html>
