<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS - Teacher Flávio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase_config.js?v=20260804-1"></script>
  <script src="/auth.js?v=20260730-1"></script>
  <link rel="stylesheet" href="/cms/cms.css?v=20260804-1">
</head>
<body class="auth-checking">
  <main class="cms-shell">
    <nav class="cms-topbar" aria-label="Navegação do CMS">
      <a href="/professor/">← Área do Professor</a>
      <a href="/" target="_blank" rel="noopener">Abrir site ↗</a>
    </nav>

    <header class="cms-header">
      <div>
        <span class="cms-badge">TEACHER FLÁVIO</span>
        <h1>Gerenciador de conteúdo</h1>
        <p>Edite textos, links e imagens sem alterar o código do site.</p>
      </div>
      <div id="cmsAuthStatus" class="cms-auth-status">Verificando credenciais...</div>
    </header>

    <section class="cms-toolbar" aria-label="Ações do CMS">
      <label>
        Página
        <select id="cmsPageSelect" disabled></select>
      </label>
      <div class="cms-actions">
        <button id="cmsReloadButton" class="button secondary" type="button" disabled>Descartar alterações</button>
        <button id="cmsSaveButton" class="button primary" type="button" disabled>Salvar e publicar</button>
      </div>
    </section>

    <div id="cmsMessage" class="cms-message" role="status" aria-live="polite"></div>
    <section id="cmsEditor" class="cms-editor" aria-busy="true"></section>
  </main>

  <script src="/cms/cms.js?v=20260804-1"></script>
</body>
</html>
