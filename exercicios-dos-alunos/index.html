<!DOCTYPE html>

  <title>Acompanhamento dos Exercícios - Teacher Flávio</title>
  <link rel="canonical" href="/exercicios-dos-alunos/">
  <script>
    (async function () {
      const response = await fetch('/exercicios_dos_alunos.html', { cache: 'no-store' });
      const html = await response.text();
      const versionedHtml = html
        .replace('<head>', '<head>\n  <base href="/">')

      document.write(versionedHtml);

  </script>
</head>
